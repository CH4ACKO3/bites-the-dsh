name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dsh: [0.1.5-rc.2, 0.1.6-alpha.2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
      - run: pnpm install --frozen-lockfile
      - name: Install isolated upstream UI bundles
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          echo '{"private":true}' > "$RUNNER_TEMP/upstream/package.json"
          npm install --prefix "$RUNNER_TEMP/upstream" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh-client-ui-chat@${{ matrix.dsh }}" "@deepseek-ai/dsh-client-ui-conversation@${{ matrix.dsh }}"
      - run: pnpm check
        env:
          DSH_BITES_UPSTREAM_ROOT: ${{ runner.temp }}/upstream
      - run: pnpm pack --dry-run
